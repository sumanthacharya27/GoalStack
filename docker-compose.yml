# Starts MySQL and GoalStack together.
# 1. Copy .env.example to .env and set DB_PASSWORD and JWT_SECRET
# 2. docker compose up --build
# 3. Open http://localhost:8080
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file}
      MYSQL_DATABASE: goalstack
    volumes:
      - goalstack-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/goalstack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in a .env file}

volumes:
  goalstack-db:
