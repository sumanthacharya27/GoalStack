spring.application.name=goalstack

# --- Database (override with environment variables; never commit real passwords) ---
spring.datasource.url=jdbc:mysql://localhost:3306/goalstack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456789

# --- Schema strategy: Flyway owns the database structure ---
# SQL files in src/main/resources/db/migration run in order on startup. Hibernate no longer changes tables.
# DDL_AUTO=validate makes Hibernate double-check that entities match the tables (useful while developing).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# A database that already has the Version 2 tables (but no Flyway history) is treated as "already at version 1".
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.sql.init.mode=never
spring.jpa.show-sql=false
# Spring Boot default, stated explicitly
spring.jpa.open-in-view=true

# --- Never leak internals to users ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Security (JWT login tokens) ---
# JWT_SECRET: at least 32 characters. If it is empty, a random secret is created at startup
# (everyone is logged out whenever the app restarts). Set it for anything beyond quick local use.
app.jwt.secret=RXCi67E2/u+WVFCo7pXgozcJyWH89TGVcOa7AnvRvTA=
app.jwt.expiry-minutes=120